<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Cast</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#e8e8ea; --muted:#9aa0aa; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:48px 16px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:16px 20px; font-size:18px; width:100%; margin:8px 0; cursor:pointer; }
  button.secondary { background:var(--card); }
  input, select { width:100%; font-size:32px; text-align:center; letter-spacing:8px; text-transform:uppercase; padding:12px; border-radius:10px; border:1px solid #333; background:var(--card); color:var(--text); }
  select { font-size:16px; letter-spacing:0; text-transform:none; margin-top:8px; }
  .code { font-size:120px; font-weight:700; letter-spacing:16px; margin:24px 0; font-family:ui-monospace, monospace; }
  .status { margin-top:16px; color:var(--muted); min-height:1.5em; }
  .hidden { display:none !important; }
  #viewer { position:fixed; inset:0; background:#000; }
  #frame { width:100%; height:100%; object-fit:contain; display:block; }
  #fsHint { position:fixed; bottom:12px; right:12px; color:#666; font-size:14px; }
</style>
</head>
<body>

<div id="home" class="wrap">
  <h1>Screen Cast</h1>
  <p>Open this page on both devices.</p>
  <button id="goView">Show a screen here (ViewSonic)</button>
  <button id="goShare" class="secondary">Share my screen (Surface)</button>
</div>

<div id="waiting" class="wrap hidden">
  <h1>Enter this code on the Surface</h1>
  <div class="code" id="codeOut">------</div>
  <div class="status" id="viewStatus">Waiting for a screen...</div>
</div>

<div id="viewer" class="hidden">
  <img id="frame" alt="">
  <div id="fsHint">Tap for fullscreen</div>
</div>

<div id="share" class="wrap hidden">
  <h1>Share your screen</h1>
  <p>Type the code shown on the ViewSonic.</p>
  <input id="codeIn" maxlength="6" autocomplete="off">
  <select id="quality">
    <option value="1280,0.6">Balanced (1280px)</option>
    <option value="960,0.55">Smoother (960px)</option>
    <option value="1920,0.7">Sharper (1920px)</option>
  </select>
  <button id="startShare">Start sharing</button>
  <button id="stopShare" class="secondary hidden">Stop sharing</button>
  <div class="status" id="shareStatus"></div>
</div>

<script>
// How it works: the Surface turns the screen into JPEG pictures and uploads them to
// ppng.io (a free public relay, no account). The ViewSonic downloads them as they arrive.
// Several "lanes" run at once so pictures keep flowing while others are in transit.
const RELAY = 'https://ppng.io/';
const PREFIX = 'jh-screencast-';
const LANES = 4;
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const $ = id => document.getElementById(id);
const show = id => ['home','waiting','viewer','share'].forEach(x => $(x).classList.toggle('hidden', x !== id));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const laneUrl = (code, k) => RELAY + PREFIX + code + '-' + k;

function makeCode() {
  let c = '';
  for (let i = 0; i < 6; i++) c += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return c;
}

// ---------- Receiver (ViewSonic) ----------
let lastStamp = 0, lastFrameAt = 0, shownUrl = null;

function startViewer() {
  const code = makeCode();
  $('codeOut').textContent = code;
  show('waiting');
  for (let k = 0; k < LANES; k++) receiveLane(code, k);

  // Go back to the code screen if pictures stop for a while
  setInterval(() => {
    if (!$('viewer').classList.contains('hidden') && Date.now() - lastFrameAt > 8000) {
      show('waiting');
      $('viewStatus').textContent = 'Sharing stopped. Waiting for a screen...';
    }
  }, 2000);
}

async function receiveLane(code, k) {
  while (true) {
    try {
      const res = await fetch(laneUrl(code, k), { cache: 'no-store' });
      if (!res.ok) { await sleep(1000); continue; }
      const buf = await res.arrayBuffer();
      // First 16 bytes = when the picture was taken, so old pictures never replace newer ones
      const stamp = Number(new TextDecoder().decode(buf.slice(0, 16)));
      if (!(stamp > lastStamp)) continue;
      lastStamp = stamp;
      lastFrameAt = Date.now();
      const url = URL.createObjectURL(new Blob([buf.slice(16)], { type: 'image/jpeg' }));
      $('frame').src = url;
      if (shownUrl) URL.revokeObjectURL(shownUrl);
      shownUrl = url;
      if ($('viewer').classList.contains('hidden')) show('viewer');
    } catch (e) {
      await sleep(1000); // network hiccup, try again
    }
  }
}

$('viewer').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', () => $('fsHint').classList.toggle('hidden', !!document.fullscreenElement));

// ---------- Sender (Surface) ----------
let stream, sharing = false, aborter, sentCount = 0, statsTimer;
const video = document.createElement('video');
video.muted = true; video.playsInline = true;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

function capture(maxW, q) {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w) return Promise.resolve(null);
  const scale = Math.min(1, maxW / w);
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
}

async function sendLane(code, k, maxW, q) {
  while (sharing) {
    const jpg = await capture(maxW, q);
    if (!jpg) { await sleep(100); continue; }
    const stamp = String(Date.now() * 10 + k).padStart(16, '0');
    try {
      // Waits here until the ViewSonic picks this picture up
      const res = await fetch(laneUrl(code, k), { method: 'POST', body: new Blob([stamp, jpg]), signal: aborter.signal });
      if (res.ok) sentCount++;
      else await sleep(500);
    } catch (e) {
      if (!sharing) return;
      await sleep(1000);
    }
  }
}

async function startShare() {
  const code = $('codeIn').value.trim().toUpperCase();
  if (code.length !== 6) { $('shareStatus').textContent = 'Code must be 6 characters.'; return; }
  const [maxW, q] = $('quality').value.split(',').map(Number);

  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false });
  } catch (e) {
    $('shareStatus').textContent = 'Screen share was cancelled.';
    return;
  }
  video.srcObject = stream;
  await video.play();
  stream.getVideoTracks()[0].addEventListener('ended', stopShare);

  sharing = true;
  aborter = new AbortController();
  sentCount = 0;
  $('shareStatus').textContent = 'Waiting for the ViewSonic...';
  for (let k = 0; k < LANES; k++) sendLane(code, k, maxW, q);

  let prev = 0;
  statsTimer = setInterval(() => {
    const fps = (sentCount - prev) / 2; prev = sentCount;
    $('shareStatus').textContent = sentCount ? 'Sharing to ' + code + ' (' + fps.toFixed(1) + ' pictures/sec)' : 'Waiting for the ViewSonic...';
  }, 2000);

  $('startShare').classList.add('hidden');
  $('stopShare').classList.remove('hidden');
}

function stopShare() {
  sharing = false;
  if (aborter) aborter.abort();
  clearInterval(statsTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('startShare').classList.remove('hidden');
  $('stopShare').classList.add('hidden');
  $('shareStatus').textContent = 'Stopped.';
}

// ---------- Wiring ----------
$('goView').onclick = () => { location.hash = 'view'; startViewer(); };
$('goShare').onclick = () => { location.hash = 'share'; show('share'); $('codeIn').focus(); };
$('startShare').onclick = startShare;
$('stopShare').onclick = stopShare;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') startShare(); });

if (location.hash === '#view') startViewer();
else if (location.hash === '#share') show('share');
</script>
</body>
</html>
