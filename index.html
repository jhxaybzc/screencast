<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Cast</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#e8e8ea; --muted:#9aa0aa; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:48px 16px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:16px 20px; font-size:18px; width:100%; margin:8px 0; cursor:pointer; }
  button.secondary { background:var(--card); }
  input { width:100%; font-size:32px; text-align:center; letter-spacing:8px; text-transform:uppercase; padding:12px; border-radius:10px; border:1px solid #333; background:var(--card); color:var(--text); }
  .code { font-size:120px; font-weight:700; letter-spacing:16px; margin:24px 0; font-family:ui-monospace, monospace; }
  .status { margin-top:16px; color:var(--muted); min-height:1.5em; }
  .hidden { display:none !important; }
  #viewer { position:fixed; inset:0; background:#000; }
  #live { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  #fsHint { position:fixed; bottom:12px; right:12px; color:#666; font-size:14px; }
</style>
</head>
<body>

<div id="home" class="wrap">
  <h1>Screen Cast</h1>
  <p>Open this page on both devices.</p>
  <button id="goView">Show a screen here (ViewSonic)</button>
  <button id="goShare" class="secondary">Share my screen (Surface)</button>
</div>

<div id="waiting" class="wrap hidden">
  <h1>Enter this code on the Surface</h1>
  <div class="code" id="codeOut">------</div>
  <div class="status" id="viewStatus">Connecting...</div>
</div>

<div id="viewer" class="hidden">
  <video id="live" autoplay muted playsinline></video>
  <div id="fsHint">Tap for fullscreen</div>
</div>

<div id="share" class="wrap hidden">
  <h1>Share your screen</h1>
  <p>Type the code shown on the ViewSonic.</p>
  <input id="codeIn" maxlength="6" autocomplete="off">
  <button id="startShare">Start sharing</button>
  <button id="stopShare" class="secondary hidden">Stop sharing</button>
  <div class="status" id="shareStatus"></div>
</div>

<script>
// Your Cloudflare Worker (the /cast route)
const RELAY = 'https://proctor-worker.jhxaybzc.workers.dev';

// How it works: the Surface records its screen as compressed video and sends it in
// fifth-of-a-second pieces over one WebSocket to your Cloudflare Worker, which passes
// them straight to the ViewSonic. Everything runs over normal HTTPS (port 443).
const relayBase = (new URLSearchParams(location.search).get('relay') || RELAY).replace(/\/$/, '').replace(/^http/, 'ws');
const wsUrl = (code, role) => relayBase + '/cast?room=' + code + '&role=' + role;
const PIECE_MS = 200;
const MIME = ['video/webm;codecs=vp8', 'video/webm;codecs=vp9', 'video/webm']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || 'video/webm;codecs=vp8';
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const $ = id => document.getElementById(id);
const show = id => ['home','waiting','viewer','share'].forEach(x => $(x).classList.toggle('hidden', x !== id));
const randomCode = () => Array.from({ length: 6 }, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join('');

// =================== Receiver (ViewSonic) ===================
const v = { code: null, ms: null, sb: null, queue: [], lastData: 0, ready: false };

function startViewer() {
  v.code = randomCode();
  $('codeOut').textContent = v.code;
  show('waiting');
  connectViewer();
  setInterval(() => {
    if (!$('viewer').classList.contains('hidden') && Date.now() - v.lastData > 6000) {
      show('waiting');
      $('viewStatus').textContent = 'Sharing stopped. Waiting for a screen...';
    }
  }, 2000);
}

function connectViewer() {
  const ws = new WebSocket(wsUrl(v.code, 'viewer'));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('viewStatus').textContent = 'Waiting for a screen...'; };
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.t === 'start') resetPlayer(m.mime);
      return;
    }
    if (!v.ready) return; // wait for the start of a recording
    v.queue.push(e.data);
    pump();
    v.lastData = Date.now();
    if ($('viewer').classList.contains('hidden')) show('viewer');
  };
  ws.onclose = () => {
    $('viewStatus').textContent = 'Reconnecting...';
    setTimeout(connectViewer, 1500);
  };
}

function resetPlayer(mime) {
  v.queue = []; v.sb = null; v.ready = false;
  if (!window.MediaSource || !MediaSource.isTypeSupported(mime)) {
    $('viewStatus').textContent = 'This browser cannot play ' + mime;
    return;
  }
  const video = $('live');
  const ms = new MediaSource();
  v.ms = ms; v.ready = true;
  video.src = URL.createObjectURL(ms);
  ms.addEventListener('sourceopen', () => {
    if (ms !== v.ms) return;
    v.sb = ms.addSourceBuffer(mime);
    v.sb.addEventListener('updateend', onUpdateEnd);
    pump();
  }, { once: true });
}

function pump() {
  const sb = v.sb;
  if (!sb || sb.updating || !v.queue.length) return;
  try { sb.appendBuffer(v.queue.shift()); } catch (e) { v.queue = []; }
}

function onUpdateEnd() {
  const sb = v.sb, video = $('live');
  if (!sb) return;
  const b = sb.buffered;
  if (b.length) {
    const end = b.end(b.length - 1);
    if (end - video.currentTime > 0.8) video.currentTime = end - 0.1; // stay live
    if (video.paused) video.play().catch(() => {});
    if (video.currentTime - b.start(0) > 20) { sb.remove(b.start(0), video.currentTime - 5); return; } // free memory
  }
  pump();
}

$('viewer').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', () => $('fsHint').classList.toggle('hidden', !!document.fullscreenElement));

// =================== Sender (Surface) ===================
const s = { code: null, stream: null, ws: null, rec: null, sharing: false, viewers: 0, sent: 0, timer: null };
const status = t => $('shareStatus').textContent = t;

function connectSender() {
  const ws = new WebSocket(wsUrl(s.code, 'sender'));
  s.ws = ws;
  ws.onopen = () => status('Connected. Waiting for the ViewSonic...');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'restart') startRecording();
    if (m.t === 'viewers') { s.viewers = m.n; if (!m.n) stopRecording(); }
  };
  ws.onclose = () => {
    stopRecording();
    if (s.sharing && s.ws === ws) { status('Reconnecting...'); setTimeout(connectSender, 1500); }
  };
}

function stopRecording() {
  if (!s.rec) return;
  s.rec.ondataavailable = null;
  try { s.rec.stop(); } catch (e) {}
  s.rec = null;
}

function startRecording() {
  stopRecording();
  const ws = s.ws;
  if (!s.sharing || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ t: 'start', mime: MIME }));
  const rec = new MediaRecorder(s.stream, { mimeType: MIME, videoBitsPerSecond: 2500000 });
  rec.ondataavailable = e => {
    if (!e.data.size || ws.readyState !== WebSocket.OPEN) return;
    if (ws.bufferedAmount > 2000000) { startRecording(); return; } // network falling behind: start fresh to stay live
    ws.send(e.data);
    s.sent += e.data.size;
  };
  s.rec = rec;
  rec.start(PIECE_MS);
}

async function startShare() {
  const code = $('codeIn').value.trim().toUpperCase();
  if (code.length !== 6) { status('Code must be 6 characters.'); return; }
  if (!window.MediaRecorder) { status('This browser cannot record the screen. Try Edge or Chrome.'); return; }
  try {
    s.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
  } catch (e) { status('Screen share was cancelled.'); return; }
  s.stream.getVideoTracks()[0].addEventListener('ended', stopShare);

  s.code = code; s.sharing = true; s.sent = 0;
  status('Connecting...');
  connectSender();

  let prev = 0;
  s.timer = setInterval(() => {
    const kbps = Math.round((s.sent - prev) * 8 / 2000); prev = s.sent;
    if (s.rec) status('Sharing to ' + code + ' (' + kbps + ' kbps' + (s.ws.bufferedAmount > 300000 ? ', network is struggling' : '') + ')');
  }, 2000);

  $('startShare').classList.add('hidden');
  $('stopShare').classList.remove('hidden');
}

function stopShare() {
  s.sharing = false;
  stopRecording();
  if (s.ws) { const ws = s.ws; s.ws = null; ws.close(); }
  clearInterval(s.timer);
  if (s.stream) { s.stream.getTracks().forEach(t => t.stop()); s.stream = null; }
  $('startShare').classList.remove('hidden');
  $('stopShare').classList.add('hidden');
  status('Stopped.');
}

// =================== Wiring ===================
$('goView').onclick = () => { location.hash = 'view'; startViewer(); };
$('goShare').onclick = () => { location.hash = 'share'; show('share'); $('codeIn').focus(); };
$('startShare').onclick = startShare;
$('stopShare').onclick = stopShare;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') startShare(); });

if (location.hash === '#view') startViewer();
else if (location.hash === '#share') show('share');
</script>
</body>
</html>
