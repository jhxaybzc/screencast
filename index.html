<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Cast</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#e8e8ea; --muted:#9aa0aa; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:48px 16px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:16px 20px; font-size:18px; width:100%; margin:8px 0; cursor:pointer; }
  button.secondary { background:var(--card); }
  input { width:100%; font-size:32px; text-align:center; letter-spacing:8px; text-transform:uppercase; padding:12px; border-radius:10px; border:1px solid #333; background:var(--card); color:var(--text); }
  .code { font-size:120px; font-weight:700; letter-spacing:16px; margin:24px 0; font-family:ui-monospace, monospace; }
  .status { margin-top:16px; color:var(--muted); min-height:1.5em; }
  .hidden { display:none !important; }
  #viewer { position:fixed; inset:0; background:#000; }
  #live { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  #fsHint { position:fixed; bottom:12px; right:12px; color:#666; font-size:14px; }
</style>
</head>
<body>

<div id="home" class="wrap">
  <h1>Screen Cast</h1>
  <p>Open this page on both devices.</p>
  <button id="goView">Show a screen here (ViewSonic)</button>
  <button id="goShare" class="secondary">Share my screen (Surface)</button>
</div>

<div id="waiting" class="wrap hidden">
  <h1>Enter this code on the Surface</h1>
  <div class="code" id="codeOut">------</div>
  <div class="status" id="viewStatus">Waiting for a screen...</div>
</div>

<div id="viewer" class="hidden">
  <video id="live" autoplay muted playsinline></video>
  <div id="fsHint">Tap for fullscreen</div>
</div>

<div id="share" class="wrap hidden">
  <h1>Share your screen</h1>
  <p>Type the code shown on the ViewSonic.</p>
  <input id="codeIn" maxlength="6" autocomplete="off">
  <button id="startShare">Start sharing</button>
  <button id="stopShare" class="secondary hidden">Stop sharing</button>
  <div class="status" id="shareStatus"></div>
</div>

<script>
// How it works: the Surface records its screen as compressed video and cuts it into
// quarter-second pieces. Each piece goes through ppng.io (a free public relay, no account,
// normal HTTPS) on one of several lanes at once. The ViewSonic puts the pieces back in
// order and plays them, always jumping to the newest moment.
const RELAY = 'https://ppng.io/';
const PREFIX = 'jh-screencast-';
const LANES = 8;
const PIECE_MS = 250;
const MIME = ['video/webm;codecs=vp8', 'video/webm;codecs=vp9', 'video/webm']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || 'video/webm;codecs=vp8';
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const $ = id => document.getElementById(id);
const show = id => ['home','waiting','viewer','share'].forEach(x => $(x).classList.toggle('hidden', x !== id));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const url = (code, name) => RELAY + PREFIX + code + '-' + name;
const randomId = n => Array.from({ length: n }, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join('');

// =================== Receiver (ViewSonic) ===================
const v = {
  code: null, session: null, seen: new Set(), expected: 0, pending: new Map(),
  ms: null, sb: null, queue: [], mime: 'video/webm;codecs=vp8', lastActivity: 0, lastAsk: 0,
};

function startViewer() {
  v.code = randomId(6);
  $('codeOut').textContent = v.code;
  show('waiting');
  helloLoop();
  for (let k = 0; k < LANES; k++) laneLoop(k);
  setInterval(() => {
    if (!$('viewer').classList.contains('hidden') && Date.now() - v.lastActivity > 8000) {
      show('waiting');
      $('viewStatus').textContent = 'Sharing stopped. Waiting for a screen...';
    }
  }, 2000);
}

// The Surface says hello at the start of every recording, so the player can start fresh
async function helloLoop() {
  while (true) {
    try {
      const res = await fetch(url(v.code, 'hello'), { cache: 'no-store' });
      if (res.ok) {
        const [session, mime] = (await res.text()).split('|');
        resetPlayer(session, mime);
        continue;
      }
    } catch (e) {}
    await sleep(1000);
  }
}

function resetPlayer(session, mime) {
  v.session = session; v.seen.add(session);
  v.expected = 0; v.pending.clear(); v.queue = [];
  v.mime = mime || v.mime;
  if (!window.MediaSource || !MediaSource.isTypeSupported(v.mime)) {
    $('viewStatus').textContent = 'This browser cannot play the video (' + v.mime + ').';
    return;
  }
  const video = $('live');
  v.ms = new MediaSource(); v.sb = null;
  video.src = URL.createObjectURL(v.ms);
  const ms = v.ms;
  ms.addEventListener('sourceopen', () => {
    if (ms !== v.ms) return;
    v.sb = ms.addSourceBuffer(v.mime);
    v.sb.addEventListener('updateend', onUpdateEnd);
    pump();
  }, { once: true });
}

function pump() {
  const sb = v.sb;
  if (!sb || sb.updating || !v.queue.length) return;
  try { sb.appendBuffer(v.queue.shift()); }
  catch (e) { askRestart(); }
}

function onUpdateEnd() {
  const sb = v.sb, video = $('live');
  if (!sb) return;
  const b = sb.buffered;
  if (b.length) {
    const end = b.end(b.length - 1);
    if (end - video.currentTime > 1.2) video.currentTime = end - 0.2; // stay live
    if (video.paused) video.play().catch(() => {});
    if (video.currentTime - b.start(0) > 20) { sb.remove(b.start(0), video.currentTime - 5); return; } // free memory
  }
  pump();
}

async function laneLoop(k) {
  while (true) {
    try {
      const res = await fetch(url(v.code, k), { cache: 'no-store' });
      if (!res.ok) { await sleep(500); continue; }
      const buf = await res.arrayBuffer();
      const head = new TextDecoder().decode(buf.slice(0, 16));
      onPiece(head.slice(0, 8), Number(head.slice(8)), buf.slice(16));
    } catch (e) {
      await sleep(500);
    }
  }
}

function onPiece(session, seq, data) {
  if (session !== v.session) {
    if (!v.seen.has(session)) askRestart(); // joined mid-recording
    return;
  }
  v.pending.set(seq, data);
  while (v.pending.has(v.expected)) {
    v.queue.push(v.pending.get(v.expected));
    v.pending.delete(v.expected);
    v.expected++;
  }
  if (v.pending.size > LANES * 3) askRestart(); // a piece went missing
  pump();
  v.lastActivity = Date.now();
  if ($('viewer').classList.contains('hidden')) show('viewer');
}

// Ask the Surface to start a fresh recording
function askRestart() {
  if (Date.now() - v.lastAsk < 4000) return;
  v.lastAsk = Date.now();
  fetch(url(v.code, 'back'), { method: 'POST', body: 'restart', signal: AbortSignal.timeout(5000) }).catch(() => {});
}

$('viewer').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', () => $('fsHint').classList.toggle('hidden', !!document.fullscreenElement));

// =================== Sender (Surface) ===================
const s = {
  code: null, stream: null, sharing: false, aborter: null, recorder: null,
  session: null, seq: 0, lanes: [], wake: [], sentBytes: 0, statsTimer: null,
};
const status = t => $('shareStatus').textContent = t;
const backlog = () => s.lanes.reduce((n, q) => n + q.length, 0);
const wakeAll = () => s.wake.forEach(w => w && w());

async function startSession() {
  if (s.recorder) { s.recorder.ondataavailable = null; try { s.recorder.stop(); } catch (e) {} s.recorder = null; }
  const session = randomId(8);
  s.session = session; s.seq = 0;
  s.lanes = Array.from({ length: LANES }, () => []);
  wakeAll();
  status('Waiting for the ViewSonic...');

  // Wait here until the ViewSonic is listening
  while (s.sharing && s.session === session) {
    try {
      const res = await fetch(url(s.code, 'hello'), { method: 'POST', body: session + '|' + MIME, signal: s.aborter.signal });
      if (res.ok) break;
    } catch (e) {}
    await sleep(1000);
  }
  if (!s.sharing || s.session !== session) return;

  const rec = new MediaRecorder(s.stream, { mimeType: MIME, videoBitsPerSecond: 2000000 });
  rec.ondataavailable = e => {
    if (!e.data.size || s.session !== session) return;
    const seq = s.seq++;
    const head = session + String(seq).padStart(8, '0');
    s.lanes[seq % LANES].push(new Blob([head, e.data]));
    const w = s.wake[seq % LANES]; if (w) w();
    if (backlog() > 16) startSession(); // falling behind (over ~4 s): start fresh so it stays live
  };
  s.recorder = rec;
  rec.start(PIECE_MS);
}

async function sendLane(k) {
  while (s.sharing) {
    const q = s.lanes[k];
    if (!q || !q.length) { await new Promise(r => { s.wake[k] = r; setTimeout(r, 1000); }); continue; }
    const piece = q[0];
    try {
      const res = await fetch(url(s.code, k), { method: 'POST', body: piece, signal: s.aborter.signal });
      if (res.ok) { if (q[0] === piece) q.shift(); s.sentBytes += piece.size; }
      else await sleep(300);
    } catch (e) {
      if (!s.sharing) return;
      await sleep(500);
    }
  }
}

async function listenBack() {
  while (s.sharing) {
    try {
      const res = await fetch(url(s.code, 'back'), { cache: 'no-store', signal: s.aborter.signal });
      if ((await res.text()) === 'restart') startSession();
    } catch (e) {
      if (!s.sharing) return;
      await sleep(1000);
    }
  }
}

async function startShare() {
  const code = $('codeIn').value.trim().toUpperCase();
  if (code.length !== 6) { status('Code must be 6 characters.'); return; }
  if (!window.MediaRecorder) { status('This browser cannot record the screen. Try Edge or Chrome.'); return; }
  try {
    s.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
  } catch (e) { status('Screen share was cancelled.'); return; }
  s.stream.getVideoTracks()[0].addEventListener('ended', stopShare);

  s.code = code; s.sharing = true; s.aborter = new AbortController(); s.sentBytes = 0;
  for (let k = 0; k < LANES; k++) sendLane(k);
  listenBack();
  startSession();

  let prev = 0;
  s.statsTimer = setInterval(() => {
    const kbps = Math.round((s.sentBytes - prev) * 8 / 2000); prev = s.sentBytes;
    if (s.sentBytes) status('Sharing to ' + code + ' (' + kbps + ' kbps, delay about ' + (0.5 + backlog() * PIECE_MS / 1000).toFixed(1) + ' s)');
  }, 2000);

  $('startShare').classList.add('hidden');
  $('stopShare').classList.remove('hidden');
}

function stopShare() {
  s.sharing = false;
  s.session = null;
  if (s.recorder) { s.recorder.ondataavailable = null; try { s.recorder.stop(); } catch (e) {} s.recorder = null; }
  if (s.aborter) s.aborter.abort();
  wakeAll();
  clearInterval(s.statsTimer);
  if (s.stream) { s.stream.getTracks().forEach(t => t.stop()); s.stream = null; }
  $('startShare').classList.remove('hidden');
  $('stopShare').classList.add('hidden');
  status('Stopped.');
}

// =================== Wiring ===================
$('goView').onclick = () => { location.hash = 'view'; startViewer(); };
$('goShare').onclick = () => { location.hash = 'share'; show('share'); $('codeIn').focus(); };
$('startShare').onclick = startShare;
$('stopShare').onclick = stopShare;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') startShare(); });

if (location.hash === '#view') startViewer();
else if (location.hash === '#share') { show('share'); }
</script>
</body>
</html>
